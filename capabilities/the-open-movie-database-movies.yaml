naftiko: 1.0.0-alpha2
info:
  label: The Open Movie Database API — Movies
  description: 'The Open Movie Database API — Movies. 1 operations. Lead operation: Get Movie By Title Or IMDb ID. Self-contained
    Naftiko capability covering one The Open Movie Database business surface.'
  tags:
  - The Open Movie Database
  - Movies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    THE_OPEN_MOVIE_DATABASE_API_KEY: THE_OPEN_MOVIE_DATABASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: the-open-movie-database-movies
    baseUri: https://www.omdbapi.com
    description: The Open Movie Database API — Movies business capability. Self-contained, no shared references.
    resources:
    - name: root
      path: /
      operations:
      - name: getmovie
        method: GET
        description: Get Movie By Title Or IMDb ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: apikey
          in: query
          type: string
          description: Your OMDb API key.
          required: true
        - name: i
          in: query
          type: string
          description: A valid IMDb ID (e.g., tt1285016). Required if 't' is not provided.
        - name: t
          in: query
          type: string
          description: Movie or series title to retrieve. Required if 'i' is not provided.
        - name: type
          in: query
          type: string
          description: 'Type of result to return: movie, series, or episode.'
        - name: y
          in: query
          type: integer
          description: Year of release.
        - name: plot
          in: query
          type: string
          description: 'Return short or full plot. Values: short (default), full.'
        - name: r
          in: query
          type: string
          description: 'Response format. Values: json (default), xml.'
        - name: callback
          in: query
          type: string
          description: JSONP callback function name.
        - name: v
          in: query
          type: integer
          description: API version (default 1).
        - name: Season
          in: query
          type: integer
          description: Season number (integer). Used to retrieve a specific TV season.
        - name: Episode
          in: query
          type: integer
          description: Episode number (integer). Used with Season to retrieve a specific episode.
    authentication:
      type: apikey
      key: apikey
      value: '{{env.THE_OPEN_MOVIE_DATABASE_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: the-open-movie-database-movies-rest
    port: 8080
    description: REST adapter for The Open Movie Database API — Movies. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: GET
        name: getmovie
        description: Get Movie By Title Or IMDb ID
        call: the-open-movie-database-movies.getmovie
        with:
          apikey: rest.apikey
          i: rest.i
          t: rest.t
          type: rest.type
          y: rest.y
          plot: rest.plot
          r: rest.r
          callback: rest.callback
          v: rest.v
          Season: rest.Season
          Episode: rest.Episode
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: the-open-movie-database-movies-mcp
    port: 9090
    transport: http
    description: MCP adapter for The Open Movie Database API — Movies. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-movie-title-imdb-id
      description: Get Movie By Title Or IMDb ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: the-open-movie-database-movies.getmovie
      with:
        apikey: tools.apikey
        i: tools.i
        t: tools.t
        type: tools.type
        y: tools.y
        plot: tools.plot
        r: tools.r
        callback: tools.callback
        v: tools.v
        Season: tools.Season
        Episode: tools.Episode
      outputParameters:
      - type: object
        mapping: $.
