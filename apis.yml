aid: the-open-movie-database
name: The Open Movie Database
description: >-
  The OMDb API is a RESTful web service to obtain movie, series, and episode information. All content and images on the
  site are contributed and maintained by users. Access movie and TV metadata including title, year, genre, director,
  cast, plot, ratings, and IMDb data. Search by title or look up by IMDb ID. Requires a free API key obtained at
  omdbapi.com/apikey.aspx.
